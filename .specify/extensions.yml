installed:
- brownfield
- bugfix
- companion
- feature-numbering
settings:
  auto_execute_hooks: true
hooks:
  after_implement:
  - extension: companion
    command: speckit.companion.after-implement
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.after-implement?
    description: Per-task journaling on implement (currentStep=implement; status=implemented
      when all tasks checked)
    condition: null
  - extension: bugfix
    command: speckit.bugfix.verify
    enabled: true
    optional: true
    priority: 10
    prompt: Run bugfix consistency check after implementation?
    description: Verify spec artifact consistency after implementation completes
    condition: null
  after_specify:
  - extension: companion
    command: speckit.companion.after-specify
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.after-specify?
    description: Record specify completion (currentStep=specify, status=specified)
      into .spec-context.json
    condition: null
  after_plan:
  - extension: companion
    command: speckit.companion.after-plan
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.after-plan?
    description: Record plan completion (currentStep=plan, status=planned) into .spec-context.json
    condition: null
  after_tasks:
  - extension: companion
    command: speckit.companion.after-tasks
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.after-tasks?
    description: Record tasks completion (currentStep=tasks, status=ready-to-implement)
      into .spec-context.json
    condition: null
  after_init:
  - extension: brownfield
    command: speckit.brownfield.scan
    enabled: true
    optional: true
    priority: 10
    prompt: Scan this existing project to customize spec-kit configuration?
    description: Auto-scan project after spec-kit init to detect tech stack and conventions
    condition: null
  before_specify:
  - extension: feature-numbering
    command: speckit.feature-numbering.before-specify
    enabled: true
    optional: false
    priority: 5
    prompt: Execute speckit.feature-numbering.before-specify?
    description: Bind specify to the next NNN-feature-name directory
    condition: null
