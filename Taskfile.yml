version: '3'

vars:
  GO: '{{default "go" .GO}}'
  NODE: '{{default "node" .NODE}}'
  NPM: '{{default "npm" .NPM}}'
  APP_ARGS: '{{default "" .APP_ARGS}}'
  NODE_VERSION: '26.8.1'
  MACOS_MINIMUM_VERSION: '13.0'
  DARWIN_CGO_ENV: '{{if eq OS "darwin"}}env MACOSX_DEPLOYMENT_TARGET={{.MACOS_MINIMUM_VERSION}} CGO_CFLAGS=-mmacosx-version-min={{.MACOS_MINIMUM_VERSION}} CGO_LDFLAGS="-mmacosx-version-min={{.MACOS_MINIMUM_VERSION}} -Wl,-no_warn_duplicate_libraries"{{end}}'
  SPECKIT_INSTALL: scripts/install-speckit.sh
  SPECKIT_UPDATE_CHECK: scripts/check-speckit-updates.py
  SPECKIT_VERSION: '1.0.1'
  SPECKIT_COMPANION_VERSION: '0.21.0'
  SPECKIT_BROWNFIELD_VERSION: '1.0.0'
  SPECKIT_BUGFIX_VERSION: '1.1.0'
  SPECKIT_FEATURE_NUMBERING_VERSION: '1.0.0'

tasks:
  default:
    desc: List available tasks.
    cmds:
      - task --list

  dev:
    desc: Build and run the complete application in development mode.
    cmds:
      - '{{.GO}} run ./cmd/build dev {{.APP_ARGS}}'

  prepare:
    desc: Verify and build protobuf, client, bindings, and Overseer assets.
    cmds:
      - '{{.GO}} run ./cmd/build prepare'

  build:
    desc: Build the application for the current or explicit GOOS/GOARCH target.
    cmds:
      - |
        if [ -n "{{.GOOS}}" ] || [ -n "{{.GOARCH}}" ]; then
          if [ -z "{{.GOOS}}" ] || [ -z "{{.GOARCH}}" ]; then
            echo 'GOOS and GOARCH must be provided together' >&2
            exit 1
          fi
          {{.GO}} run ./cmd/build build --target "{{.GOOS}}/{{.GOARCH}}"
        else
          {{.GO}} run ./cmd/build build
        fi

  package:
    desc: Package macOS for development by default or one unsigned portable archive for an explicit matching GOOS/GOARCH target, including darwin/arm64.
    cmds:
      - |
        if [ -n "{{.GOOS}}" ] || [ -n "{{.GOARCH}}" ]; then
          if [ -z "{{.GOOS}}" ] || [ -z "{{.GOARCH}}" ]; then
            echo 'GOOS and GOARCH must be provided together' >&2
            exit 1
          fi
          {{.GO}} run ./cmd/build package --target "{{.GOOS}}/{{.GOARCH}}"
        else
          {{.GO}} run ./cmd/build package
        fi

  package:all:
    desc: Package Darwin natively and all portable targets locally with Docker.
    cmds:
      - |
        if [ -n "{{.OUTPUT}}" ]; then
          {{.GO}} run ./cmd/build package-all-docker --output "{{.OUTPUT}}"
        else
          {{.GO}} run ./cmd/build package-all-docker
        fi

  release:publish:
    desc: Publish the prevalidated five-archive tag inventory through pinned GoReleaser.
    cmds:
      - 'go tool -modfile=tools/goreleaser/go.mod goreleaser release --clean --config .goreleaser.yaml'

  release:tag:
    desc: Propose, confirm, create, and push the next release tag; set PRERELEASE (for example, rc.1) for a prerelease.
    env:
      PRERELEASE: '{{default "" .PRERELEASE}}'
    vars:
      RELEASE_TAG:
        sh: |
          module_path="$({{.GO}} list -m)"
          module_major="${module_path##*/v}"
          case "$module_major" in
            ''|*[!0-9]*)
              printf 'root module path must end in /vN: %s\n' "$module_path" >&2
              exit 1
              ;;
          esac

          current_tag="$(go tool -modfile=tools/svu/go.mod svu current)"
          current_version="${current_tag#v}"
          current_major="${current_version%%.*}"
          case "$current_major" in
            ''|*[!0-9]*)
              printf 'svu returned an invalid current tag: %s\n' "$current_tag" >&2
              exit 1
              ;;
          esac

          if [ "$current_major" -gt "$module_major" ]; then
            printf 'current tag major v%s exceeds module major v%s\n' "$current_major" "$module_major" >&2
            exit 1
          fi
          if [ "$current_major" -lt "$module_major" ]; then
            svu_command=major
          else
            svu_command=next
          fi

          if [ "$svu_command" = next ]; then
            set -- next --always
          else
            set -- major
          fi
          if [ -n "$PRERELEASE" ]; then
            set -- "$@" --prerelease "$PRERELEASE"
          fi
          release_tag="$(go tool -modfile=tools/svu/go.mod svu "$@")"
          {{.GO}} run ./cmd/build validate-release-tag --tag "$release_tag" >/dev/null
          printf '%s\n' "$release_tag"
    prompt: 'Create and push release tag {{.RELEASE_TAG}} to origin?'
    preconditions:
      - sh: test -z "$(git status --porcelain)"
        msg: The worktree must be clean before creating a release tag.
      - sh: git remote get-url origin >/dev/null
        msg: Git remote origin is not configured.
      - sh: test -z "$(git tag --list '{{.RELEASE_TAG}}')"
        msg: Release tag {{.RELEASE_TAG}} already exists locally.
    cmds:
      - |
        git tag "{{.RELEASE_TAG}}"
        if ! git push origin "refs/tags/{{.RELEASE_TAG}}"; then
          git tag --delete "{{.RELEASE_TAG}}"
          exit 1
        fi

  deps:
    desc: Install all locked Node.js dependencies.
    cmds:
      - task: deps:frontend
      - task: deps:browser

  node:check:
    desc: Verify the executing Node.js runtime matches the project pin exactly.
    run: once
    silent: true
    cmds:
      - |
        {{.NODE}} -e '
          const expected = "{{.NODE_VERSION}}";
          const actual = process.versions.node;
          if (actual !== expected) {
            console.error(`Node.js ${expected} is required; found ${process.version}. Run "nvm use" from the repository root.`);
            process.exit(1);
          }
        '

  deps:frontend:
    desc: Install locked client and Overseer workspace dependencies.
    cmds:
      - task: node:check
      - '{{.NPM}} ci --prefix frontend'

  deps:browser:
    desc: Install locked browser-test dependencies.
    cmds:
      - task: node:check
      - '{{.NPM}} ci --prefix tests/browser'

  speckit:install:
    desc: Install pinned Spec Kit and all project extensions.
    env:
      SPECKIT_VERSION: '{{.SPECKIT_VERSION}}'
      SPECKIT_COMPANION_VERSION: '{{.SPECKIT_COMPANION_VERSION}}'
      SPECKIT_BROWNFIELD_VERSION: '{{.SPECKIT_BROWNFIELD_VERSION}}'
      SPECKIT_BUGFIX_VERSION: '{{.SPECKIT_BUGFIX_VERSION}}'
      SPECKIT_FEATURE_NUMBERING_VERSION: '{{.SPECKIT_FEATURE_NUMBERING_VERSION}}'
    cmds:
      - '{{.SPECKIT_INSTALL}}'

  speckit:update:check:
    desc: Check for Spec Kit and Companion updates without installing them.
    env:
      SPECKIT_VERSION: '{{.SPECKIT_VERSION}}'
      SPECKIT_COMPANION_VERSION: '{{.SPECKIT_COMPANION_VERSION}}'
      SPECKIT_BROWNFIELD_VERSION: '{{.SPECKIT_BROWNFIELD_VERSION}}'
      SPECKIT_BUGFIX_VERSION: '{{.SPECKIT_BUGFIX_VERSION}}'
      SPECKIT_FEATURE_NUMBERING_VERSION: '{{.SPECKIT_FEATURE_NUMBERING_VERSION}}'
    cmds:
      - '{{.SPECKIT_UPDATE_CHECK}}'

  speckit:update:test:
    desc: Run the network-free Spec Kit update-checker regression tests.
    cmds:
      - python3 scripts/test_check_speckit_updates.py

  companion:test:
    desc: Run the network-free Companion lifecycle regression tests.
    cmds:
      - python3 -m unittest discover -s .specify/extensions/companion/scripts -p 'test_*.py'

  fmt:
    desc: Format all Go sources.
    cmds:
      - gofmt -w .

  fmt:check:
    desc: Fail when a Go source is not formatted.
    cmds:
      - |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then
          printf 'Go files need formatting:\n%s\n' "$unformatted" >&2
          exit 1
        fi

  vet:
    desc: Run Go static analysis.
    cmds:
      - '{{.DARWIN_CGO_ENV}} {{.GO}} vet ./...'

  lint:
    desc: Run the pinned golangci-lint tool.
    cmds:
      - '{{.GO}} tool -modfile=tools/golangci-lint/go.mod golangci-lint run'

  test:
    desc: Run the Go test suite.
    cmds:
      - '{{.DARWIN_CGO_ENV}} {{.GO}} test ./...'

  test:race:
    desc: Run the Go test suite with the race detector.
    cmds:
      - '{{.DARWIN_CGO_ENV}} {{.GO}} test -race ./...'

  frontend:typecheck:
    desc: Type-check both frontend applications without installing dependencies.
    cmds:
      - task: frontend:typecheck:overseer
      - task: frontend:typecheck:client

  frontend:typecheck:overseer:
    desc: Type-check only the Overseer application without installing dependencies.
    cmds:
      - '{{.NPM}} run typecheck:overseer --prefix frontend'

  frontend:typecheck:client:
    desc: Type-check only the Player application without installing dependencies.
    cmds:
      - '{{.NPM}} run typecheck:client --prefix frontend'

  frontend:build:
    desc: Install locked frontend dependencies and build both production applications.
    cmds:
      - task: deps:frontend
      - task: frontend:build:overseer
      - task: frontend:build:client

  frontend:build:overseer:
    desc: Build only the Overseer application without installing dependencies.
    cmds:
      - '{{.NPM}} run build:overseer --prefix frontend'

  frontend:build:client:
    desc: Build only the Player application without installing dependencies.
    cmds:
      - '{{.NPM}} run build:client --prefix frontend'

  frontend:compatibility:check:
    desc: Verify current and legacy session/player-config persistence compatibility through the browser fixture boundary.
    cmds:
      - scripts/frontend-focused-browser-check.sh tests/browser/persistence-compatibility.spec.mjs 'legacy/current session and player config round-trip through migrated boundary'

  frontend:policy:check:
    desc: Verify frontend dependency, source, type-safety, and trust-boundary policy.
    cmds:
      - scripts/frontend-policy-check.sh

  frontend:reproducible:check:
    desc: Build both frontend applications twice and compare exact output-tree manifests.
    cmds:
      - scripts/reproducible-build-check.sh --frontend

  startup:check:
    desc: Run repository startup and workflow-surface contracts.
    cmds:
      - '{{.DARWIN_CGO_ENV}} {{.GO}} test ./internal/platform -run "Test(WailsV3|Taskfile|QualityWorkflow|PortableRelease|Distribution)"'

  wails:pins:check:
    desc: Verify the exact Wails v3.0.0-beta.15 and frontend 3.0.0-beta.15 pins.
    cmds:
      - scripts/wails-v3-contract-check.sh

  proto:format:check:
    desc: Check protobuf source formatting with pinned Buf.
    cmds:
      - 'go tool -modfile=tools/buf/go.mod buf format proto --diff --exit-code'

  proto:lint:
    desc: Lint protobuf contracts with pinned Buf.
    cmds:
      - 'go tool -modfile=tools/buf/go.mod buf lint proto'

  proto:drift:check:
    desc: Check deterministic protobuf generation drift.
    cmds:
      - scripts/proto-drift-test.sh

  proto:generated:check:
    desc: Verify generated Go and browser protobuf code compiles cleanly.
    cmds:
      - task: node:check
      - '{{.GO}} test ./internal/gen/...'
      - '{{.NPM}} run build:client --prefix frontend'

  ci:quality:
    desc: Run deterministic, non-publishing pull-request and main quality checks.
    cmds:
      - task: test
      - task: vet
      - task: frontend:build
      - task: wails:pins:check
      - task: bindings:check
      - task: proto:format:check
      - task: proto:lint
      - task: proto:drift:check
      - task: proto:breaking
      - task: proto:generated:check

  proto:generate:
    desc: Regenerate protobuf code and update the reviewed revision.
    cmds:
      - task: deps:frontend
      - scripts/proto-generate.sh --sync-revision

  proto:check:
    desc: Verify protobuf formatting, generation, and generated clients.
    cmds:
      - task: deps:frontend
      - scripts/proto-check.sh

  proto:breaking:
    desc: Verify protobuf compatibility and negative fixtures.
    cmds:
      - scripts/proto-breaking.sh --all-fixtures

  bindings:check:
    desc: Verify deterministic Wails bindings and their public surface.
    cmds:
      - scripts/wails-bindings-check.sh

  browser:test:
    desc: Install Chromium and run Playwright journeys.
    cmds:
      - task: deps:frontend
      - task: deps:browser
      - '{{.NPM}} exec --prefix tests/browser -- playwright install chromium'
      - '{{.NPM}} test --prefix tests/browser'

  check:
    desc: Run the main local quality gates.
    cmds:
      - task: fmt:check
      - task: vet
      - task: lint
      - task: test:race
      - task: proto:check
      - task: proto:breaking
      - task: bindings:check
      - task: speckit:update:test
      - task: companion:test

  release:macos:preflight:
    desc: Validate Developer ID and notarization prerequisites.
    cmds:
      - scripts/build-macos.sh --preflight

  release:macos:signed:
    desc: Build, sign, notarize, and verify the release DMG.
    cmds:
      - scripts/build-macos.sh
