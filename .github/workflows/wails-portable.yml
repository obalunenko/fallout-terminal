name: Wails Portable
run-name: Portable ${{ inputs.correlation_id || github.ref_name }}

on:
  push:
    branches:
      - '021-windows-linux-support'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      correlation_id:
        description: Correlation identifier generated by package:all:remote
        required: true
        type: string
      source_sha:
        description: Exact pushed source revision to package
        required: true
        type: string
      validate_release:
        description: Build and join the signed Darwin candidate without publishing a tag
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: wails-portable-${{ inputs.correlation_id || github.ref_name }}
  cancel-in-progress: false

env:
  GO_VERSION: 1.27.x
  NODE_VERSION: 20.19.0
  SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
  CORRELATION_ID: ${{ inputs.correlation_id || format('tag-{0}-{1}', github.ref_name, github.run_id) }}

jobs:
  package:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows/amd64
            goos: windows
            goarch: amd64
            runner: windows-2025
            archive: Fallout-Terminal-windows-amd64.zip
          - target: windows/arm64
            goos: windows
            goarch: arm64
            runner: windows-11-arm
            archive: Fallout-Terminal-windows-arm64.zip
          - target: linux/amd64
            goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            archive: Fallout-Terminal-linux-amd64.tar.gz
          - target: linux/arm64
            goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            archive: Fallout-Terminal-linux-arm64.tar.gz
    steps:
      - name: Check out exact clean source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse --verify HEAD^{commit})"
          test "$actual" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            tools/buf/go.sum
            tools/golangci-lint/go.sum
            tools/protoc-gen-connect-go/go.sum
            tools/protoc-gen-go/go.sum
            tools/task/go.sum
            tools/wails/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux native runtime and smoke dependencies
        if: ${{ matrix.goos == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            at-spi2-core build-essential dbus-x11 gnome-keyring libgtk-4-dev libwebkitgtk-6.0-dev \
            openbox pkg-config python3 python3-pyatspi x11-utils xdotool xvfb

      - name: Package native target with pinned Task
        shell: bash
        run: go tool -modfile=tools/task/go.mod task package GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }}

      - name: Verify Windows package launch and cleanup
        if: ${{ matrix.goos == 'windows' }}
        shell: pwsh
        run: ./scripts/verify-windows-package.ps1 "build/dist/${{ matrix.archive }}"

      - name: Verify Linux package launch and cleanup
        if: ${{ matrix.goos == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail
          dbus-run-session -- bash -lc '
            set -euo pipefail
            eval "$(printf "\n" | gnome-keyring-daemon --unlock --components=secrets)"
            export NO_AT_BRIDGE=0
            export WEBKIT_DISABLE_DMABUF_RENDERER=1
            xvfb-run -a -s "-screen 0 1280x800x24" scripts/verify-linux-package.sh "$1"
          ' _ "build/dist/${{ matrix.archive }}"

      - name: Verify Linux secure-store outage remains fail-closed
        if: ${{ matrix.goos == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail
          dbus-run-session -- bash -lc '
            set -euo pipefail
            go run ./cmd/native-credential-smoke --expect-unavailable
          '

      - name: Confirm verification left only canonical publish inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s "build/dist/${{ matrix.archive }}"
          test -s "build/dist/${{ matrix.archive }}.sha256"

      - name: Upload verified native artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 7
          path: |
            build/dist/${{ matrix.archive }}
            build/dist/${{ matrix.archive }}.sha256

  aggregate:
    name: Gate complete portable matrix
    if: ${{ always() }}
    needs: [package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require every native target to be eligible
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$PACKAGE_RESULT" = success || {
            echo 'portable matrix is incomplete or unverifiable' >&2
            exit 1
          }

      - name: Download verified target artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          merge-multiple: true
          path: combined

      - name: Build and validate aggregate index
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re

          root = pathlib.Path("combined")
          targets = [
              ("windows/amd64", "Fallout-Terminal-windows-amd64.zip"),
              ("windows/arm64", "Fallout-Terminal-windows-arm64.zip"),
              ("linux/amd64", "Fallout-Terminal-linux-amd64.tar.gz"),
              ("linux/arm64", "Fallout-Terminal-linux-arm64.tar.gz"),
          ]
          expected = {name for _, name in targets}
          expected |= {name + ".sha256" for _, name in targets}
          actual = {path.name for path in root.iterdir() if path.is_file()}
          assert actual == expected, f"incomplete or unexpected portable inventory: {sorted(actual)}"
          assert not any(path.is_dir() for path in root.iterdir()), "unexpected directory in portable inventory"

          artifacts = []
          for target, name in targets:
              archive = root / name
              digest = hashlib.sha256(archive.read_bytes()).hexdigest()
              sidecar = (root / (name + ".sha256")).read_text(encoding="ascii")
              assert sidecar == f"{digest}  {name}\n", f"invalid checksum sidecar for {target}"
              artifacts.append({"target": target, "archiveName": name, "checksum": digest})

          correlation = os.environ["CORRELATION_ID"]
          source = os.environ["SOURCE_SHA"]
          assert re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{7,127}", correlation), "invalid correlation identifier"
          assert re.fullmatch(r"[0-9a-f]{40}|[0-9a-f]{64}", source), "invalid source revision"
          index = {
              "schemaVersion": 1,
              "correlationID": correlation,
              "sourceRevision": source,
              "artifacts": artifacts,
          }
          (root / "aggregate-index.json").write_text(
              json.dumps(index, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload complete portable matrix
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: fallout-terminal-portable
          if-no-files-found: error
          retention-days: 7
          path: combined/*

  macos-trust:
    name: Build trusted Darwin release candidate
    if: ${{ (github.event_name == 'push' && github.ref_type == 'tag') || inputs.validate_release || (github.event_name == 'push' && github.ref == 'refs/heads/021-windows-linux-support' && contains(github.event.head_commit.message, '[validate-release]')) }}
    uses: ./.github/workflows/wails-macos.yml
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}
      release_candidate: true
    secrets: inherit

  release-join:
    name: Gate complete five-target release candidate
    if: ${{ (github.event_name == 'push' && github.ref_type == 'tag') || inputs.validate_release || (github.event_name == 'push' && github.ref == 'refs/heads/021-windows-linux-support' && contains(github.event.head_commit.message, '[validate-release]')) }}
    needs: [aggregate, macos-trust]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download complete portable matrix
        uses: actions/download-artifact@v4
        with:
          name: fallout-terminal-portable
          path: combined

      - name: Download trusted Darwin candidate
        uses: actions/download-artifact@v4
        with:
          name: fallout-terminal-darwin
          path: darwin

      - name: Validate and join exact five-target inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          source = os.environ["SOURCE_SHA"]
          combined = pathlib.Path("combined")
          darwin = pathlib.Path("darwin")
          portable_expected = {
              "aggregate-index.json",
              "Fallout-Terminal-windows-amd64.zip",
              "Fallout-Terminal-windows-amd64.zip.sha256",
              "Fallout-Terminal-windows-arm64.zip",
              "Fallout-Terminal-windows-arm64.zip.sha256",
              "Fallout-Terminal-linux-amd64.tar.gz",
              "Fallout-Terminal-linux-amd64.tar.gz.sha256",
              "Fallout-Terminal-linux-arm64.tar.gz",
              "Fallout-Terminal-linux-arm64.tar.gz.sha256",
          }
          darwin_expected = {
              "Fallout-Terminal-arm64.dmg",
              "Fallout-Terminal-arm64.dmg.sha256",
              "darwin-verification.json",
          }
          assert {path.name for path in combined.iterdir() if path.is_file()} == portable_expected
          assert {path.name for path in darwin.iterdir() if path.is_file()} == darwin_expected
          assert not any(path.is_dir() for path in combined.iterdir())
          assert not any(path.is_dir() for path in darwin.iterdir())

          index = json.loads((combined / "aggregate-index.json").read_text(encoding="utf-8"))
          assert index["sourceRevision"] == source, "portable aggregate source revision mismatch"
          assert len(index["artifacts"]) == 4, "portable aggregate must contain exactly four targets"
          evidence = json.loads((darwin / "darwin-verification.json").read_text(encoding="utf-8"))
          assert evidence == {
              "schemaVersion": 1,
              "target": "darwin/arm64",
              "sourceRevision": source,
              "artifact": "Fallout-Terminal-arm64.dmg",
          }, "Darwin verification record mismatch"

          dmg = darwin / "Fallout-Terminal-arm64.dmg"
          digest = hashlib.sha256(dmg.read_bytes()).hexdigest()
          assert (darwin / "Fallout-Terminal-arm64.dmg.sha256").read_text(encoding="ascii") == (
              f"{digest}  Fallout-Terminal-arm64.dmg\n"
          ), "Darwin checksum sidecar mismatch"
          for name in ["Fallout-Terminal-arm64.dmg", "Fallout-Terminal-arm64.dmg.sha256"]:
              (combined / name).write_bytes((darwin / name).read_bytes())

          release_expected = portable_expected | {
              "Fallout-Terminal-arm64.dmg",
              "Fallout-Terminal-arm64.dmg.sha256",
          }
          assert {path.name for path in combined.iterdir() if path.is_file()} == release_expected
          assert all(path.stat().st_size > 0 for path in combined.iterdir())
          PY

      - name: Upload preverified five-target release candidate
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: fallout-terminal-release-candidate
          if-no-files-found: error
          retention-days: 7
          path: combined/*

  publish:
    name: Publish tagged five-target release
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    needs: [release-join]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            tools/goreleaser/go.sum
            tools/oras/go.sum

      - name: Download complete five-target release candidate
        uses: actions/download-artifact@v4
        with:
          name: fallout-terminal-release-candidate
          path: combined

      - name: Validate tag and publication inventory
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || {
            echo 'release tags must use vMAJOR.MINOR.PATCH with an optional prerelease suffix' >&2
            exit 1
          }
          expected=(
            Fallout-Terminal-arm64.dmg
            Fallout-Terminal-arm64.dmg.sha256
            aggregate-index.json
            Fallout-Terminal-windows-amd64.zip
            Fallout-Terminal-windows-amd64.zip.sha256
            Fallout-Terminal-windows-arm64.zip
            Fallout-Terminal-windows-arm64.zip.sha256
            Fallout-Terminal-linux-amd64.tar.gz
            Fallout-Terminal-linux-amd64.tar.gz.sha256
            Fallout-Terminal-linux-arm64.tar.gz
            Fallout-Terminal-linux-arm64.tar.gz.sha256
          )
          mapfile -t actual < <(find combined -maxdepth 1 -type f -exec basename {} \; | sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          [[ "${actual[*]}" == "${wanted[*]}" ]] || {
            printf 'unexpected release inventory:\n%s\n' "${actual[*]}" >&2
            exit 1
          }
          for artifact in combined/*; do
            test -s "$artifact"
          done

      - name: Refuse existing publication destinations
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          package_repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          package_reference="ghcr.io/${package_repository}:${GITHUB_REF_NAME}"
          printf '%s' "$GHCR_TOKEN" | go tool -modfile=tools/oras/go.mod oras login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "GitHub Release ${GITHUB_REF_NAME} already exists; refusing a non-atomic replacement" >&2
            exit 1
          fi
          if go tool -modfile=tools/oras/go.mod oras manifest fetch "$package_reference" >/dev/null 2>&1; then
            echo "GHCR artifact ${package_reference} already exists; refusing a non-atomic replacement" >&2
            exit 1
          fi
          printf 'PACKAGE_REFERENCE=%s\n' "$package_reference" >> "$GITHUB_ENV"
          printf 'PUBLICATION_STARTED=1\n' >> "$GITHUB_ENV"

      - name: Create complete draft release with GoReleaser v2
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go tool -modfile=tools/goreleaser/go.mod goreleaser release --clean --config .goreleaser.yaml

      - name: Publish complete release to GitHub Packages
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | go tool -modfile=tools/oras/go.mod oras login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          go tool -modfile=tools/oras/go.mod oras push "$PACKAGE_REFERENCE" \
            --artifact-type application/vnd.fallout-terminal.release.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --annotation "org.opencontainers.image.version=${GITHUB_REF_NAME}" \
            combined/Fallout-Terminal-arm64.dmg:application/x-apple-diskimage \
            combined/Fallout-Terminal-arm64.dmg.sha256:text/plain \
            combined/aggregate-index.json:application/json \
            combined/Fallout-Terminal-windows-amd64.zip:application/zip \
            combined/Fallout-Terminal-windows-amd64.zip.sha256:text/plain \
            combined/Fallout-Terminal-windows-arm64.zip:application/zip \
            combined/Fallout-Terminal-windows-arm64.zip.sha256:text/plain \
            combined/Fallout-Terminal-linux-amd64.tar.gz:application/gzip \
            combined/Fallout-Terminal-linux-amd64.tar.gz.sha256:text/plain \
            combined/Fallout-Terminal-linux-arm64.tar.gz:application/gzip \
            combined/Fallout-Terminal-linux-arm64.tar.gz.sha256:text/plain

      - name: Expose complete GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq .id)"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" -F draft=false >/dev/null

      - name: Roll back incomplete cross-destination publication
        if: ${{ failure() && env.PUBLICATION_STARTED == '1' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          printf '%s' "$GHCR_TOKEN" | go tool -modfile=tools/oras/go.mod oras login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          go tool -modfile=tools/oras/go.mod oras manifest delete --force "$PACKAGE_REFERENCE"
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq .id 2>/dev/null)"
          if [[ -n "$release_id" ]]; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
          fi
