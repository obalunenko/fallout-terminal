name: Wails Cross-Platform Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: wails-cross-platform-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.27.x
  NODE_VERSION: 20.19.0

jobs:
  release-config:
    name: Check GoReleaser v2 configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out clean source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: tools/goreleaser/go.sum

      - name: Validate release configuration
        run: go tool -modfile=tools/goreleaser/go.mod goreleaser check --config .goreleaser.yaml

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows/amd64
            goos: windows
            goarch: amd64
            runner: windows-2025
            executable: build/bin/windows-amd64/Fallout Terminal.exe
          - target: windows/arm64
            goos: windows
            goarch: arm64
            runner: windows-11-arm
            executable: build/bin/windows-arm64/Fallout Terminal.exe
          - target: linux/amd64
            goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            executable: build/bin/linux-amd64/Fallout Terminal
          - target: linux/arm64
            goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            executable: build/bin/linux-arm64/Fallout Terminal
    steps:
      - name: Check out clean source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            tools/buf/go.sum
            tools/task/go.sum
            tools/wails/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        if: ${{ matrix.goos == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential libgtk-4-dev libwebkitgtk-6.0-dev pkg-config

      - name: Build native target with pinned Task
        shell: bash
        run: go tool -modfile=tools/task/go.mod task build GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }}

      - name: Verify build output
        shell: bash
        env:
          EXECUTABLE: ${{ matrix.executable }}
        run: test -s "$EXECUTABLE"
