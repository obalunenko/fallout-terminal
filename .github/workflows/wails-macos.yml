name: Wails macOS

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact source revision shared by the five-target release candidate
        required: true
        type: string
      release_candidate:
        description: Build the Darwin DMG and verify its SHA-256 sidecar
        required: true
        type: boolean
  workflow_dispatch:
  push:
    branches:
      - 'main'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - '*'

permissions:
  contents: read

concurrency:
  group: wails-macos-${{ github.ref }}-${{ inputs.source_sha || github.sha }}
  cancel-in-progress: ${{ !inputs.release_candidate }}

env:
  GO_VERSION: 1.27.x
  NODE_VERSION: 20.19.0
  SOURCE_SHA: ${{ inputs.source_sha || github.sha }}

jobs:
  ci:
    name: Lint, test, protobuf, and app
    runs-on: macos-15
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      CGO_CFLAGS: -mmacosx-version-min=13.0
      CGO_LDFLAGS: -mmacosx-version-min=13.0
    steps:
      - name: Check out exact clean source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            tools/buf/go.sum
            tools/golangci-lint/go.sum
            tools/protoc-gen-connect-go/go.sum
            tools/protoc-gen-go/go.sum
            tools/task/go.sum
            tools/wails/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lint
        run: go tool -modfile=tools/task/go.mod task fmt:check vet lint

      - name: Test
        run: go tool -modfile=tools/task/go.mod task test

      - name: Build protobuf
        run: go tool -modfile=tools/task/go.mod task proto:check

      - name: Build application
        run: go tool -modfile=tools/task/go.mod task package

  release-candidate:
    name: SHA-256 verified Darwin release candidate
    if: ${{ inputs.release_candidate }}
    needs: [ci]
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      CGO_CFLAGS: -mmacosx-version-min=13.0
      CGO_LDFLAGS: -mmacosx-version-min=13.0
    steps:
      - name: Check out exact clean source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            tools/buf/go.sum
            tools/protoc-gen-connect-go/go.sum
            tools/protoc-gen-go/go.sum
            tools/task/go.sum
            tools/wails/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Darwin application
        run: go tool -modfile=tools/task/go.mod task package

      - name: Build and verify checksum-only Darwin DMG
        shell: bash
        run: |
          set -euo pipefail
          app='build/bin/Fallout Terminal.app'
          dmg='build/bin/Fallout-Terminal-arm64.dmg'
          sidecar="$dmg.sha256"
          staging="$RUNNER_TEMP/fallout-terminal-dmg"
          test -d "$app"
          mkdir "$staging"
          ditto "$app" "$staging/Fallout Terminal.app"
          hdiutil create -volname 'Fallout Terminal' -srcfolder "$staging" -ov -format UDZO "$dmg"
          digest="$(shasum -a 256 "$dmg" | awk '{print $1}')"
          printf '%s  %s\n' "$digest" "$(basename "$dmg")" >"$sidecar"
          (cd build/bin && shasum -a 256 -c Fallout-Terminal-arm64.dmg.sha256)

      - name: Bind Darwin evidence to the exact source revision
        shell: bash
        run: |
          set -euo pipefail
          dmg=build/bin/Fallout-Terminal-arm64.dmg
          sidecar="$dmg.sha256"
          test -s "$dmg"
          test -s "$sidecar"
          (cd build/bin && shasum -a 256 -c Fallout-Terminal-arm64.dmg.sha256)
          printf '{"schemaVersion":1,"target":"darwin/arm64","sourceRevision":"%s","artifact":"Fallout-Terminal-arm64.dmg"}\n' \
            "$SOURCE_SHA" >build/bin/darwin-verification.json

      - name: Upload checksum-verified Darwin release candidate
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: fallout-terminal-darwin
          if-no-files-found: error
          retention-days: 7
          path: |
            build/bin/Fallout-Terminal-arm64.dmg
            build/bin/Fallout-Terminal-arm64.dmg.sha256
            build/bin/darwin-verification.json
