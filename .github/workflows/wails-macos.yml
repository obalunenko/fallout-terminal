name: Wails macOS

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches:
      - '*'


permissions:
  contents: read

concurrency:
  group: wails-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.27.x
  NODE_VERSION: 20.19.0

jobs:
  ci:
    name: Lint, test, protobuf, and app
    runs-on: macos-15
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      CGO_CFLAGS: -mmacosx-version-min=13.0
      CGO_LDFLAGS: -mmacosx-version-min=13.0
    steps:
      - name: Check out clean source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            tools/buf/go.sum
            tools/golangci-lint/go.sum
            tools/protoc-gen-connect-go/go.sum
            tools/protoc-gen-go/go.sum
            tools/task/go.sum
            tools/wails/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json

      - name: Lint
        run: go tool -modfile=tools/task/go.mod task fmt:check vet lint

      - name: Test
        run: go tool -modfile=tools/task/go.mod task test

      - name: Build protobuf
        run: go tool -modfile=tools/task/go.mod task proto:check

      - name: Build application
        run: go tool -modfile=tools/task/go.mod task package
