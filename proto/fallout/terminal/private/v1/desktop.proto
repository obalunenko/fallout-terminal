syntax = "proto3";

package fallout.terminal.private.v1;

import "fallout/terminal/persistence/v1/player_config.proto";
import "fallout/terminal/persistence/v1/session.proto";
import "fallout/terminal/player/v1/terminal.proto";
import "fallout/terminal/private/v1/coordination.proto";

option go_package = "github.com/obalunenko/Fallout-Terminal/v2/internal/gen/fallout/terminal/private/v1;privatev1";

message CommandResult {
  bool ok = 1;
  optional string error = 2;
}

message LogAccessResult {
  bool ok = 1;
  optional string error = 2;
  string directory_path = 3;
  optional string active_log_path = 4;
}

message SessionOperationResult {
  bool ok = 1;
  bool canceled = 2;
  optional string error = 3;
  optional string file_path = 4;
  fallout.terminal.persistence.v1.Session session = 5;
}

message SaveSessionResult {
  bool ok = 1;
  optional string error = 2;
  uint64 requested_revision = 3;
  optional uint64 saved_revision = 4;
}

message PlayerConfigOperationResult {
  bool ok = 1;
  bool canceled = 2;
  optional string error = 3;
  fallout.terminal.persistence.v1.PlayerConfig player_config = 4;
  fallout.terminal.persistence.v1.Session session = 5;
  CoordinationState state = 6;
  PlayerConfigMetadata player_config_metadata = 7;
}

message CoordinationResult {
  bool ok = 1;
  optional string error = 2;
  CoordinationState state = 3;
}

message TerminalSwitchResult {
  bool ok = 1;
  optional string error = 2;
  TerminalSwitchStatus status = 3;
  optional string switch_id = 4;
  CoordinationState state = 5;
}

message TerminalActivationRequest {
  string terminal_id = 1;
  string terminal_name = 2;
  fallout.terminal.persistence.v1.ContentNode tree = 3;
  int32 hack_level = 4;
  string intro_text = 5;
}

message LiveTerminalUpdateRequest {
  fallout.terminal.persistence.v1.ContentNode tree = 1;
  optional string intro_text = 2;
}

message TerminalSwitchDecisionRequest {
  string switch_id = 1;
  TerminalSwitchChoice choice = 2;
}

message ResolveCommandExecutionRequest {
  string request_id = 1;
  CommandExecutionDecision decision = 2;
}

message ResolveCommandExecutionResult {
  bool ok = 1;
  optional string error = 2;
  CoordinationState state = 3;
  FacilityOperationResult facility_result = 4;
}

enum FacilityFailureCode {
  FACILITY_FAILURE_CODE_UNSPECIFIED = 0;
  FACILITY_FAILURE_CODE_REJECTED = 1;
  FACILITY_FAILURE_CODE_MISSING_REFERENCE = 2;
  FACILITY_FAILURE_CODE_INVALID_TRANSITION = 3;
  FACILITY_FAILURE_CODE_PRECONDITION_FAILED = 4;
  FACILITY_FAILURE_CODE_STALE_REVISION = 5;
  FACILITY_FAILURE_CODE_CONFLICT = 6;
  FACILITY_FAILURE_CODE_DUPLICATE = 7;
  FACILITY_FAILURE_CODE_INVALID_CONFIGURATION = 8;
  FACILITY_FAILURE_CODE_PERSISTENCE_FAILED = 9;
  FACILITY_FAILURE_CODE_RUNTIME_CONTEXT_ENDED = 10;
}

enum FacilityEntityKind {
  FACILITY_ENTITY_KIND_UNSPECIFIED = 0;
  FACILITY_ENTITY_KIND_DEVICE = 1;
  FACILITY_ENTITY_KIND_DEVICE_STATE = 2;
  FACILITY_ENTITY_KIND_DEVICE_TRANSITION = 3;
  FACILITY_ENTITY_KIND_CONDITION = 4;
  FACILITY_ENTITY_KIND_RECOVERY_PROGRAM = 5;
}

enum FacilityDependencyKind {
  FACILITY_DEPENDENCY_KIND_UNSPECIFIED = 0;
  FACILITY_DEPENDENCY_KIND_TRANSITION_PRECONDITION = 1;
  FACILITY_DEPENDENCY_KIND_TRANSITION_CONDITION_EFFECT = 2;
  FACILITY_DEPENDENCY_KIND_RECOVERY_REFERENCE = 3;
  FACILITY_DEPENDENCY_KIND_RECOVERY_PROGRAM_TRANSITION = 4;
  FACILITY_DEPENDENCY_KIND_COMMAND_ACTION = 5;
  FACILITY_DEPENDENCY_KIND_NAME_VARIANT = 6;
  FACILITY_DEPENDENCY_KIND_ENTRY_CONTENT_VARIANT = 7;
  FACILITY_DEPENDENCY_KIND_VISIBILITY = 8;
  FACILITY_DEPENDENCY_KIND_AVAILABILITY = 9;
  FACILITY_DEPENDENCY_KIND_DIAGNOSTIC_SCOPE = 10;
  FACILITY_DEPENDENCY_KIND_DIAGNOSTIC_EFFECT = 11;
}

message FacilityIssue {
  FacilityFailureCode code = 1;
  string entity_kind = 2;
  optional string entity_id = 3;
  optional string reference_kind = 4;
  optional string reference_id = 5;
}

message FacilityOperationResult {
  bool ok = 1;
  bool changed = 2;
  string correlation_id = 3;
  FacilityFailureCode failure = 4;
  repeated FacilityIssue issues = 5;
  uint64 session_revision = 6;
  uint64 previous_facility_revision = 7;
  uint64 resulting_facility_revision = 8;
  repeated string affected_device_ids = 9;
  repeated string affected_condition_ids = 10;
  fallout.terminal.persistence.v1.Session session = 11;
}

message FacilityEntityReference {
  FacilityEntityKind kind = 1;
  string entity_id = 2;
  optional string owner_id = 3;
}

message FacilityDependency {
  FacilityDependencyKind kind = 1;
  string source_id = 2;
  string target_id = 3;
  string property = 4;
  optional string terminal_id = 5;
}

message FacilityDependencyReport {
  FacilityEntityReference target = 1;
  repeated FacilityDependency dependencies = 2;
}

message InspectFacilityDependenciesRequest {
  FacilityEntityReference target = 1;
  uint64 expected_session_revision = 2;
  uint64 expected_facility_revision = 3;
}

message InspectFacilityDependenciesResult {
  bool ok = 1;
  FacilityFailureCode failure = 2;
  repeated FacilityIssue issues = 3;
  uint64 session_revision = 4;
  uint64 facility_revision = 5;
  FacilityDependencyReport report = 6;
}

message PreviewFacilityDeviceState {
  string device_id = 1;
  string state_id = 2;
}

message PreviewFacilityCondition {
  string condition_id = 1;
  bool active = 2;
}

message PreviewFacilityRequest {
  uint64 expected_facility_revision = 1;
  string terminal_id = 2;
  oneof preview {
    PreviewFacilityDeviceState device_state = 3;
    PreviewFacilityCondition condition = 4;
  }
}

message PreviewFacilityResult {
  bool ok = 1;
  FacilityFailureCode failure = 2;
  repeated FacilityIssue issues = 3;
  uint64 facility_revision = 4;
  fallout.terminal.player.v1.LiveTerminal terminal = 5;
}

message SaveFacilityAuthoringRequest {
  fallout.terminal.persistence.v1.Session session = 1;
  uint64 expected_session_revision = 2;
  uint64 expected_facility_revision = 3;
  string correlation_id = 4;
}

message ResetFacilityDeviceRequest {
  string device_id = 1;
  uint64 expected_facility_revision = 2;
  string correlation_id = 3;
}

message ResetFacilityRequest {
  uint64 expected_facility_revision = 1;
  string correlation_id = 2;
}

message RecoverFacilityConditionRequest {
  string condition_id = 1;
  uint64 expected_facility_revision = 2;
  string correlation_id = 3;
  fallout.terminal.persistence.v1.DiagnosticRecoveryReference recovery = 4;
}

message ResolveTerminalNavigationRequest {
  string request_id = 1;
  TerminalNavigationDecision decision = 2;
}

message ResolveTerminalNavigationResult {
  bool ok = 1;
  optional string error = 2;
  CoordinationState state = 3;
}

message ResetCommandStateRequest {
  string terminal_id = 1;
  string command_id = 2;
}

message ResetTerminalCommandStatesRequest {
  string terminal_id = 1;
}

message SessionStateResult {
  bool ok = 1;
  optional string error = 2;
  uint64 revision = 3;
  fallout.terminal.persistence.v1.Session session = 4;
}

message ReplaceTerminalGroupsRequest {
  repeated fallout.terminal.persistence.v1.TerminalGroup terminal_groups = 1;
  uint64 expected_session_revision = 2;
  uint64 expected_coordination_revision = 3;
}

message ReplaceTerminalGroupsResult {
  bool ok = 1;
  optional string error = 2;
  uint64 session_revision = 3;
  fallout.terminal.persistence.v1.Session session = 4;
  CoordinationState coordination_state = 5;
}

message ResetFailedHackRequest {
  string terminal_id = 1;
  string terminal_name = 2;
  fallout.terminal.persistence.v1.ContentNode tree = 3;
  int32 hack_level = 4;
  string intro_text = 5;
}

message AddCharacterRequest {
  string display_name = 1;
  int32 intelligence = 2;
  optional bool hacker_perk_available = 3;
  uint64 expected_revision = 4;
}

message RenameCharacterRequest {
  string character_id = 1;
  string display_name = 2;
  int32 intelligence = 3;
  optional bool hacker_perk_available = 4;
  uint64 expected_revision = 5;
}

message DeleteCharacterRequest {
  string character_id = 1;
  uint64 expected_revision = 2;
}

message RenameLogicalSessionRequest {
  string logical_session_id = 1;
  string fallback_name = 2;
}

message AssignCharacterRequest {
  string logical_session_id = 1;
  string character_id = 2;
}

message ReleaseCharacterRequest {
  string logical_session_id = 1;
}

message MoveCharacterRequest {
  string character_id = 1;
  string destination_session_id = 2;
}

message SetActiveControllerRequest {
  string logical_session_id = 1;
}

message OpenUrlRequest {
  string url = 1;
}
