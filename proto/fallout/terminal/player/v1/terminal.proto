syntax = "proto3";

package fallout.terminal.player.v1;

import "fallout/terminal/player/v1/hacking.proto";
import "fallout/terminal/player/v1/navigation.proto";

option go_package = "github.com/obalunenko/Fallout-Terminal/internal/gen/fallout/terminal/player/v1;playerv1";

enum CommandExecutionPhase {
  COMMAND_EXECUTION_PHASE_UNSPECIFIED = 0;
  COMMAND_EXECUTION_PHASE_PENDING = 1;
  COMMAND_EXECUTION_PHASE_REJECTED = 2;
}

enum TerminalNavigationDirection {
  TERMINAL_NAVIGATION_DIRECTION_UNSPECIFIED = 0;
  TERMINAL_NAVIGATION_DIRECTION_FORWARD = 1;
  TERMINAL_NAVIGATION_DIRECTION_RETURN = 2;
}

message CommandExecutionPresentation {
  CommandExecutionPhase phase = 1;
  string command_node_id = 2;
}

message TerminalReturnTarget {
  string terminal_id = 1;
  string terminal_name = 2;
}

message PendingTerminalNavigationPresentation {
  TerminalNavigationDirection direction = 1;
  string target_terminal_id = 2;
  string target_terminal_name = 3;
}

message TerminalNavigationPresentation {
  uint32 route_depth = 1;
  optional TerminalReturnTarget return_target = 2;
  optional PendingTerminalNavigationPresentation pending = 3;
}

message NoControllerTerminalPresentation {}

message MenuSelection {
  string target_id = 1;
}

message InformationPagePosition {
  uint32 page_index = 1;
}

message HackingPreview {
  oneof target {
    string target_id = 1;
    string pattern_id = 2;
  }
}

message ControllerTerminalPresentation {
  string context_key = 1;
  oneof presentation {
    NoControllerTerminalPresentation none = 2;
    MenuSelection menu = 3;
    InformationPagePosition page = 4;
    HackingPreview hacking = 5;
  }
}

message ContentFolder {
  repeated ContentNode children = 1;
}

message ContentCommand {
  string text = 1;
}

message ContentEntry {
  string description = 1;
}

message ContentNode {
  string id = 1;
  string name = 2;
  oneof content {
    ContentFolder folder = 3;
    ContentCommand command = 4;
    ContentEntry entry = 5;
  }
}

message LiveTerminal {
  string terminal_id = 1;
  string terminal_name = 2;
  ContentNode tree = 3;
  int32 hack_level = 4;
  string intro_text = 5;
  NavigationState navigation = 6;
  PublicHackState hacking = 7;
  optional CommandExecutionPresentation command_execution = 8;
  optional TerminalNavigationPresentation terminal_navigation = 9;
  ControllerTerminalPresentation controller_presentation = 10;
}

message NoLiveTerminal {}

message TerminalPresentation {
  oneof presentation {
    LiveTerminal live_terminal = 1;
    NoLiveTerminal no_live_terminal = 2;
  }
}
