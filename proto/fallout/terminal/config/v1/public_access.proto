syntax = "proto3";

package fallout.terminal.config.v1;

option go_package = "github.com/obalunenko/Fallout-Terminal/v2/internal/gen/fallout/terminal/config/v1;configv1";

// PublicAccessPreferences is the version-1, secret-free Application Support contract.
// Presence hints are non-authoritative and must be reconciled with secure-store metadata.
message PublicAccessPreferences {
  uint32 version = 1;
  bool enabled_preference = 2;
  optional string reserved_domain = 3;
  string username = 4;
  bool provider_token_present_hint = 5;
  bool player_password_present_hint = 6;
  uint64 revision = 7;
}
