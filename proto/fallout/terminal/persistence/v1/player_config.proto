syntax = "proto3";

package fallout.terminal.persistence.v1;

option go_package = "github.com/obalunenko/Fallout-Terminal/v2/internal/gen/fallout/terminal/persistence/v1;persistencev1";

message RosterEntry {
  string id = 1;
  string name = 2;
  optional int32 intelligence = 3;
  optional bool hacker_perk_available = 4;
}

message PlayerConfig {
  int32 version = 1;
  string name = 2;
  repeated RosterEntry roster = 3;
}
