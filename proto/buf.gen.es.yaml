version: v2
clean: true

inputs:
  - directory: proto
    paths:
      - proto/fallout/terminal/player/v1

plugins:
  - local:
      - npm
      - exec
      - --prefix
      - frontend
      - --
      - protoc-gen-es
    out: frontend/client/gen
    opt:
      - target=ts
      - import_extension=js
